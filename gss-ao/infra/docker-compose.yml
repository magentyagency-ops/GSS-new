# ============================================================================
# docker-compose.yml — environnement de dev GSS-AO
# ============================================================================
# NB : Docker n'est pas installé sur la machine de dev actuelle (cf. DECISIONS.md
# D2). Ce fichier décrit la cible ; en local sans Docker, l'ingestion RAG tourne
# en mode JSONL dry-run (VECTOR_STORE=jsonl).
# ============================================================================

services:
  # --- PostgreSQL + pgvector (store RAG + métier) ---------------------------
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gss
      POSTGRES_PASSWORD: gss
      POSTGRES_DB: gss_ao
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gss -d gss_ao"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- MinIO (stockage objets S3-compatible, Module A) ---------------------
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gss
      MINIO_ROOT_PASSWORD: gssgsspwd
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  # --- Backend FastAPI ------------------------------------------------------
  backend:
    build:
      context: ..
      dockerfile: infra/backend.Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://gss:gss@postgres:5432/gss_ao
      VECTOR_STORE: pgvector
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000

volumes:
  pgdata:
  miniodata:
